# sops policy: which age recipients every secrets file is encrypted to.
#
# Two kinds of recipients:
#   - admin keys : your PERSONAL age key(s), so you (a human) can edit secrets.
#   - host keys  : each MACHINE's age key (derived from its SSH host key), so
#                  that machine can decrypt secrets at activation.
#
# Every secret is encrypted to ALL recipients below. When you add a new machine,
# append its host key here and run `sops updatekeys secrets/secrets.yaml`.
#
# The anchor names below (admin_jakek, host_jakek) are just labels — only the
# age key values matter, so renaming an anchor never requires re-encrypting.
keys:
  # personal key — `age-keygen -y ~/.config/sops/age/keys.txt`
  - &admin_jakek age1whmz44htegdkj6ta5yackgxv852cq75nawz3r2hqege98tqmdvaq9d4e42
  # this machine — `ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub`
  - &host_jakek age18xmrfllfxkmsaudzu6jkds8h24qdc9um3wqcjdym6hs3tqqu832qasm8f7
  - &host_jakek_laptop age19puvvs87e7s8he63ag7kk4lp6gn609zysewsngfzqgalx87j3v8s5sswl7

creation_rules:
  - path_regex: secrets/[^/]+\.(yaml|json)$
    key_groups:
      - age:
          - *admin_jakek
          - *host_jakek
          - *host_jakek_laptop
